[package]
name = "ssgg"
version = "0.1.0"
edition = "2021"
description = "Native Linux SteelSeries GG replacement"
authors = ["Qoder Development Team"]
license = "MIT"
repository = "https://github.com/qoder/steelseries-linux"
readme = "README.md"

# Workspace: Main package only (tools use separate bin sections)
[workspace]

[profile.dev]
debug = 2
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Workspace lint configuration for CI
[workspace.lints.rust]
unused = "allow"
dead_code = "allow"
warnings = "allow"

[features]
default = []
audio = ["libpulse-binding"]       # Audio mixing support
sonar = ["reqwest"]                # Sonar HTTP API integration
experimental-apex-2023 = []        # Experimental Apex Pro TKL 2023 support
wayland-overlay = []              # Wayland screen capture for mouse tracker

[dependencies]
# Security & Encryption
zeroize = "1.8"              # Secure memory clearing
subtle = "2.6"               # Constant-time crypto operations
base64 = "0.22"              # Secure encoding

# HID & Hardware
hidapi = "2.6.6"
udev = "0.9"
libusb-sys = "0.2"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP Server (GameSense)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# HTTP Client (Sonar)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
semver = "1.0"              # Version checking

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI Framework (GTK4 - optional)
gtk4 = { version = "0.10", features = ["v4_14"], optional = true }

# System info
sysinfo = "0.33"

# Terminal output
tabled = { version = "0.17", features = ["derive"] }
colored = "3.0"
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4"] }

# Configuration
toml = "0.8"
directories = "6.0"

# PulseAudio (optional)
libpulse-binding = { version = "2.0", optional = true }

# Image processing (for OLED, icons)
image = "0.25"

[dev-dependencies]
tempfile = "3.15"
mockall = "0.13"
rand = "0.8"

[[bin]]
name = "ssgg"
path = "src/main.rs"

[[bin]]
name = "sonar_control"
path = "tools/sonar_control/main.rs"
required-features = ["sonar"]

[[bin]]
name = "discover_actuation"
path = "tools/discover_actuation/main.rs"

# Build optimizations
[build-dependencies]
